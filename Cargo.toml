[package]
name = "waffle"
version = "0.3.1"
description = "Wasm Analysis Framework For Lightweight Experiments"
authors = ["Chris Fallin <chris@cfallin.org>"]
license = "Apache-2.0 WITH LLVM-exception"
edition = "2018"
repository = "https://github.com/bytecodealliance/waffle"

[dependencies]
wasmparser = { path = "../wasm-tools/crates/wasmparser", version = "0.259", default-features = false, features = ["std", "validate", "simd"] }
wasm-encoder = { path = "../wasm-tools/crates/wasm-encoder", version = "0.259", default-features = false }
anyhow = "1.0"
log = "0.4"
fxhash = "0.2"
smallvec = "1.13"

# Optional dependencies below.

rayon = { version = "1.10", optional = true }
addr2line = { version = "0.21", optional = true }
structopt = { version = "0.3", optional = true }
env_logger = { version = "0.11", optional = true }
libfuzzer-sys = { version = "0.4.7", optional = true }
wasm-smith = { path = "../wasm-tools/crates/wasm-smith", version = "0.259", optional = true }

[dev-dependencies]
wat = { path = "../wasm-tools/crates/wat" }
# The multiloop validation test needs the runtime feature-flag API.
wasmparser = { path = "../wasm-tools/crates/wasmparser", version = "0.259", default-features = false, features = ["std", "validate", "simd", "features"] }
env_logger = "0.11"

[features]
default = []

# Enable parallelism in the backend via rayon.
parallel = ["dep:rayon"]

# Enable DWARF debug-info parsing/preservation via addr2line/gimli.
dwarf = ["dep:addr2line"]

# Enable the `waffle-util` command-line tool.
cli = ["dep:structopt", "dep:env_logger"]

# Enable fuzzing entrypoints.
fuzzing = ["libfuzzer-sys", "wasm-smith"]

[[bin]]
name = "waffle-util"
required-features = ["cli"]
